openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: >-
    API document cho hệ thống đặt xe CAB System theo SRS và domain-oriented design.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Đăng ký tài khoản
      description: Cho phép khách hàng tạo tài khoản mới trong CAB System.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, email, password]
              properties:
                fullName:
                  type: string
                  minLength: 2
                  example: Nguyễn Văn A
                phone:
                  type: string
                  pattern: '^[0-9]{10,11}$'
                  example: '0909123456'
                email:
                  type: string
                  format: email
                  example: customer@example.com
                password:
                  type: string
                  minLength: 8
                  example: P@ssword123
      responses:
        '201':
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, tokenType, expiresIn]
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiJ9...
                  refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiJ9...
                  tokenType:
                    type: string
                    enum: [Bearer]
                    example: Bearer
                  expiresIn:
                    type: integer
                    example: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập
      description: Xác thực người dùng và trả về JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: customer@example.com
                password:
                  type: string
                  example: P@ssword123
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, tokenType, expiresIn]
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiJ9...
                  refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiJ9...
                  tokenType:
                    type: string
                    enum: [Bearer]
                    example: Bearer
                  expiresIn:
                    type: integer
                    example: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/me:
    get:
      tags: [Customer Management]
      summary: Lấy thông tin hồ sơ cá nhân
      description: Trả về hồ sơ khách hàng đang đăng nhập.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Customer Management]
      summary: Cập nhật hồ sơ cá nhân
      description: Cập nhật thông tin cá nhân của khách hàng.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: Nguyễn Văn A
                phone:
                  type: string
                  example: '0909123456'
                email:
                  type: string
                  format: email
                  example: customer@example.com
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customers/me/trips:
    get:
      tags: [Customer Management]
      summary: Lấy lịch sử chuyến đi của khách hàng
      description: Tra cứu lịch sử chuyến đi, số tiền thanh toán và giao dịch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách chuyến đi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /drivers/me:
    get:
      tags: [Driver Management]
      summary: Lấy thông tin tài xế
      description: Trả về hồ sơ tài xế đang đăng nhập.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Driver Management]
      summary: Cập nhật thông tin tài xế
      description: Cập nhật hồ sơ tài xế và thông tin phương tiện.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: Trần Văn B
                phone:
                  type: string
                  example: '0912345678'
                availability:
                  type: string
                  enum: [AVAILABLE, BUSY, OFFLINE]
                  example: AVAILABLE
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /drivers/me/availability:
    patch:
      tags: [Driver Management]
      summary: Cập nhật trạng thái sẵn sàng
      description: Cập nhật trạng thái hoạt động của tài xế.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability:
                  type: string
                  enum: [AVAILABLE, BUSY, OFFLINE]
                  example: AVAILABLE
      responses:
        '200':
          description: Cập nhật trạng thái thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
  /drivers/me/location:
    patch:
      tags: [Driver Management]
      summary: Cập nhật vị trí hiện tại
      description: Cập nhật vị trí hiện tại của tài xế để hỗ trợ theo dõi chuyến đi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                  format: double
                  example: 10.7801
                longitude:
                  type: number
                  format: double
                  example: 106.7009
      responses:
        '200':
          description: Cập nhật vị trí thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
  /trips:
    post:
      tags: [Trip Management]
      summary: Tạo yêu cầu đặt chuyến
      description: Khách hàng gửi yêu cầu đặt xe với thông tin điểm đón, điểm đến và loại xe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupLocation, dropoffLocation, vehicleType]
              properties:
                pickupLocation:
                  type: string
                  example: 123 Lê Lợi, Q1, TP.HCM
                dropoffLocation:
                  type: string
                  example: 456 Võ Văn Tần, Q3, TP.HCM
                vehicleType:
                  type: string
                  enum: [ECONOMY, STANDARD, PREMIUM]
                  example: ECONOMY
                notes:
                  type: string
                  nullable: true
                  example: Gọi xe cho gia đình
      responses:
        '201':
          description: Yêu cầu đặt chuyến được tạo thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{tripId}:
    get:
      tags: [Trip Management]
      summary: Lấy thông tin chuyến đi
      description: Trả về thông tin chi tiết của chuyến đi theo mã chuyến.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Thông tin chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/accept:
    post:
      tags: [Trip Management]
      summary: Tài xế nhận chuyến
      description: Tài xế xác nhận nhận chuyến từ hệ thống.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Nhận chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/reject:
    post:
      tags: [Trip Management]
      summary: Tài xế từ chối chuyến
      description: Tài xế từ chối chuyến, hệ thống tiếp tục tìm tài xế khác.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Từ chối chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{tripId}/status:
    patch:
      tags: [Trip Management]
      summary: Cập nhật trạng thái chuyến
      description: Tài xế cập nhật trạng thái chuyến từ điểm đón đến khi hoàn thành.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [REQUESTED, DRIVER_ACCEPTED, PICKUP, IN_PROGRESS, COMPLETED, CANCELLED]
                  example: PICKUP
      responses:
        '200':
          description: Trạng thái chuyến được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{tripId}/tracking:
    get:
      tags: [Trip Management]
      summary: Theo dõi chuyến đi
      description: Lấy vị trí tài xế, trạng thái chuyến và thời gian dự kiến.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Thông tin theo dõi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{tripId}/payments:
    post:
      tags: [Trip Management]
      summary: Tạo giao dịch thanh toán
      description: Khách hàng chọn phương thức thanh toán và hệ thống ghi nhận giao dịch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod, amount]
              properties:
                paymentMethod:
                  type: string
                  enum: [CASH, ELECTRONIC]
                  example: ELECTRONIC
                amount:
                  type: number
                  format: double
                  example: 175000
                notes:
                  type: string
                  nullable: true
                  example: Thanh toán cho chuyến đi hoàn thành
      responses:
        '201':
          description: Giao dịch thanh toán được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{tripId}/ratings:
    post:
      tags: [Trip Management]
      summary: Đánh giá tài xế
      description: Khách hàng đánh giá tài xế sau khi chuyến đi hoàn thành.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  nullable: true
                  example: Tài xế thân thiện và đúng giờ.
      responses:
        '201':
          description: Đánh giá đã được lưu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports/summary:
    get:
      tags: [Reports]
      summary: Lấy báo cáo tổng hợp
      description: Cung cấp báo cáo về số lượng chuyến, doanh thu, tỷ lệ hoàn thành, tỷ lệ hủy và hiệu quả tài xế.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tổng hợp báo cáo thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token để xác thực người dùng theo vai trò trong CAB System.
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Mã định danh chuyến đi.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Số trang của danh sách.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Số lượng bản ghi trên một trang.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Người dùng không có quyền thực hiện thao tác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Lỗi hệ thống.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu đầu vào không hợp lệ.
        details:
          type: array
          description: Danh sách chi tiết lỗi nghiệp vụ hoặc validation.
          items:
            type: string
            example: tripId là bắt buộc.
        traceId:
          type: string
          example: cab-2026-09-16-0001
    Customer:
      type: object
      required: [id, fullName, phone, email]
      properties:
        id:
          type: string
          format: uuid
          example: cst-001
        fullName:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: '0909123456'
        email:
          type: string
          format: email
          example: customer@example.com
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          example: '2026-09-16T08:00:00Z'
    Driver:
      type: object
      required: [id, fullName, driverLicense, phone, availability]
      properties:
        id:
          type: string
          format: uuid
          example: drv-001
        fullName:
          type: string
          example: Trần Văn B
        driverLicense:
          type: string
          example: B2-123456
        phone:
          type: string
          example: '0912345678'
        availability:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE]
          example: AVAILABLE
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        lastLocation:
          $ref: '#/components/schemas/Location'
    Vehicle:
      type: object
      required: [plateNumber, vehicleType]
      properties:
        plateNumber:
          type: string
          example: 59A-12345
        vehicleType:
          type: string
          enum: [ECONOMY, STANDARD, PREMIUM]
          example: ECONOMY
        brand:
          type: string
          example: Toyota
        color:
          type: string
          example: Đen
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: ACTIVE
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: 10.7801
        longitude:
          type: number
          format: double
          example: 106.7009
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-16T08:45:00Z'
    Trip:
      type: object
      required: [id, customerId, driverId, pickupLocation, dropoffLocation, tripStatus]
      properties:
        id:
          type: string
          format: uuid
          example: trip-001
        customerId:
          type: string
          format: uuid
          example: cst-001
        driverId:
          type: string
          format: uuid
          nullable: true
          example: drv-001
        pickupLocation:
          type: string
          example: 123 Lê Lợi, Q1, TP.HCM
        dropoffLocation:
          type: string
          example: 456 Võ Văn Tần, Q3, TP.HCM
        tripStatus:
          type: string
          enum: [REQUESTED, DRIVER_ACCEPTED, PICKUP, IN_PROGRESS, COMPLETED, CANCELLED]
          example: REQUESTED
        estimatedFare:
          type: number
          format: double
          example: 180000
        finalFare:
          type: number
          format: double
          nullable: true
          example: 175000
        createdAt:
          type: string
          format: date-time
          example: '2026-09-16T08:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-16T08:40:00Z'
    TrackingResponse:
      type: object
      required: [tripId, status, estimatedArrival]
      properties:
        tripId:
          type: string
          format: uuid
          example: trip-001
        status:
          type: string
          enum: [REQUESTED, DRIVER_ACCEPTED, PICKUP, IN_PROGRESS, COMPLETED, CANCELLED]
          example: DRIVER_ACCEPTED
        driver:
          $ref: '#/components/schemas/DriverTracking'
        estimatedArrival:
          type: string
          format: date-time
          example: '2026-09-16T08:55:00Z'
    DriverTracking:
      type: object
      required: [id, fullName, latitude, longitude]
      properties:
        id:
          type: string
          format: uuid
          example: drv-001
        fullName:
          type: string
          example: Trần Văn B
        latitude:
          type: number
          format: double
          example: 10.7823
        longitude:
          type: number
          format: double
          example: 106.6991
    Payment:
      type: object
      required: [id, tripId, paymentMethod, amount, status]
      properties:
        id:
          type: string
          format: uuid
          example: pay-001
        tripId:
          type: string
          format: uuid
          example: trip-001
        paymentMethod:
          type: string
          enum: [CASH, ELECTRONIC]
          example: ELECTRONIC
        amount:
          type: number
          format: double
          example: 175000
        status:
          type: string
          enum: [PENDING, PROCESSING, PAID, FAILED]
          example: PENDING
        transactionCode:
          type: string
          nullable: true
          example: TXN-20260916-001
        paidAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-16T09:00:00Z'
    Rating:
      type: object
      required: [id, tripId, driverId, rating]
      properties:
        id:
          type: string
          format: uuid
          example: rating-001
        tripId:
          type: string
          format: uuid
          example: trip-001
        driverId:
          type: string
          format: uuid
          example: drv-001
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Tài xế thân thiện và đúng giờ.
    ReportSummary:
      type: object
      required: [totalTrips, totalRevenue, completionRate, cancellationRate]
      properties:
        totalTrips:
          type: integer
          example: 1250
        totalRevenue:
          type: number
          format: double
          example: 485000000
        completionRate:
          type: number
          format: double
          example: 92.5
        cancellationRate:
          type: number
          format: double
          example: 4.8
        driverEfficiency:
          type: array
          items:
            $ref: '#/components/schemas/DriverEfficiency'
    DriverEfficiency:
      type: object
      required: [driverId, fullName, completedTrips, rating]
      properties:
        driverId:
          type: string
          format: uuid
          example: drv-001
        fullName:
          type: string
          example: Trần Văn B
        completedTrips:
          type: integer
          example: 110
        rating:
          type: number
          format: double
          example: 4.8
