paths:
  /drivers/me:
    get:
      operationId: getCurrentDriver
      tags: [Driver Management]
      summary: Lấy thông tin tài xế
      description: Trả về hồ sơ tài xế đang đăng nhập.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '../../schemas/driver/Driver.yaml'
        '401':
          $ref: '../../responses/common.yaml#/components/responses/Unauthorized'
    patch:
      operationId: updateCurrentDriver
      tags: [Driver Management]
      summary: Cập nhật thông tin tài xế
      description: Cập nhật hồ sơ tài xế và thông tin phương tiện.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/driver/DriverUpdateRequest.yaml'
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '../../schemas/driver/Driver.yaml'
        '400':
          $ref: '../../responses/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../responses/common.yaml#/components/responses/Unauthorized'
  /drivers/me/availability:
    patch:
      operationId: updateDriverAvailability
      tags: [Driver Management]
      summary: Cập nhật trạng thái sẵn sàng
      description: Cập nhật trạng thái hoạt động của tài xế.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/driver/AvailabilityRequest.yaml'
      responses:
        '200':
          description: Cập nhật trạng thái thành công.
          content:
            application/json:
              schema:
                $ref: '../../schemas/driver/Driver.yaml'
        '400':
          $ref: '../../responses/common.yaml#/components/responses/BadRequest'
  /drivers/me/location:
    patch:
      operationId: updateDriverLocation
      tags: [Driver Management]
      summary: Cập nhật vị trí hiện tại
      description: Cập nhật vị trí hiện tại của tài xế để hỗ trợ theo dõi chuyến đi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/driver/LocationUpdateRequest.yaml'
      responses:
        '200':
          description: Cập nhật vị trí thành công.
          content:
            application/json:
              schema:
                $ref: '../../schemas/driver/Location.yaml'
        '400':
          $ref: '../../responses/common.yaml#/components/responses/BadRequest'
