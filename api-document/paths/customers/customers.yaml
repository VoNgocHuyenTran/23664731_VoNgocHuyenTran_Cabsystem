paths:
  /customers/me:
    get:
      operationId: getCurrentCustomer
      tags: [Customer Management]
      summary: Lấy thông tin hồ sơ cá nhân
      description: Trả về hồ sơ khách hàng đang đăng nhập.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công.
          content:
            application/json:
              schema:
                $ref: '../../schemas/customer/Customer.yaml'
        '401':
          $ref: '../../responses/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../responses/common.yaml#/components/responses/NotFound'
    patch:
      operationId: updateCurrentCustomer
      tags: [Customer Management]
      summary: Cập nhật hồ sơ cá nhân
      description: Cập nhật thông tin cá nhân của khách hàng.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/customer/CustomerUpdateRequest.yaml'
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '../../schemas/customer/Customer.yaml'
        '400':
          $ref: '../../responses/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../responses/common.yaml#/components/responses/Unauthorized'
  /customers/me/trips:
    get:
      operationId: listCustomerTrips
      tags: [Customer Management]
      summary: Lấy lịch sử chuyến đi của khách hàng
      description: Tra cứu lịch sử chuyến đi, số tiền thanh toán và giao dịch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../parameters/common.yaml#/components/parameters/Page'
        - $ref: '../../parameters/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách chuyến đi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../schemas/trip/Trip.yaml'
        '401':
          $ref: '../../responses/common.yaml#/components/responses/Unauthorized'
