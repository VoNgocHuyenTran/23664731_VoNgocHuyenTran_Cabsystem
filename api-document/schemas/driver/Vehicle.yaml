type: object
required:
  - plateNumber
  - vehicleType
properties:
  plateNumber:
    type: string
    example: "59A-12345"
  vehicleType:
    type: string
    enum: [ECONOMY, STANDARD, PREMIUM]
    example: ECONOMY
  brand:
    type: string
    example: "Toyota"
  color:
    type: string
    example: "Đen"
  status:
    type: string
    enum: [ACTIVE, INACTIVE]
    example: ACTIVE
