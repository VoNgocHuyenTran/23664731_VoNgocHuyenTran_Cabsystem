components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Mã định danh chuyến đi.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Số trang của danh sách.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Số lượng bản ghi trên một trang.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
